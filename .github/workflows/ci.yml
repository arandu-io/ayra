name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version,
          # and setup-go installs exactly that -- whose standard library carries
          # vulnerabilities fixed later, which govulncheck below is right to
          # fail on. "stable" is what people actually run.
          go-version: stable

      # The engine reaches the window system, the input stack and the GPU
      # through the system's own libraries, so the headers have to be here
      # before anything compiles. On a machine with none of them the failure is
      # pkg-config saying a package was not found, which reads as a broken
      # checkout rather than as a runner missing its development packages.
      #
      # This is not a dependency of the module. Nothing here is downloaded by
      # the go command, nothing here appears in go.mod, and a person building
      # for macOS or Windows needs none of it -- it is the Linux backend's half
      # of an operating system interface.
      - name: the libraries the Linux backend compiles against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev wayland-protocols \
            libegl-mesa0 libgl1-mesa-dri libglx-mesa0 x11-utils xvfb

      # A formatting difference is a failure, not a comment on a pull request.
      - name: gofmt
        # `gofmt -l .` skips nothing, and not everything in the tree is meant to
        # be read by it:
        #
        #   testdata/    fixtures that are invalid on purpose
        #   *.kyse.go    view sources; the compiler excludes them by build tag,
        #                and gofmt does not read build tags
        #
        # The published tree under module/resources is NOT excluded. Those files
        # land in somebody's project, and arriving unformatted is arriving
        # wrong.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The engine is being rewritten, and how far along that is gets counted
      # rather than claimed: the suite compares every file under engine/ against
      # the version it was copied from and reports how many are still the same
      # work. That comparison needs the original in the module cache, and this
      # module does not require it -- so it is fetched here, in a throwaway
      # module, which leaves go.mod and go.sum untouched.
      #
      # Without this step the count would skip, and a gate that skips is a gate
      # that does not exist. That is why the test fails rather than skips when
      # CI is set and the tree is missing.
      - name: the version the engine was copied from
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          go mod init provenance >/dev/null
          go mod download gioui.org@v0.10.2
          echo "fetched into $(go env GOMODCACHE)"

      - name: test
        run: go test -race ./...

      # The checked-in shader bindings are generated elsewhere, but their
      # Apple target selection is repaired locally and idempotently. Running
      # that postprocessor here makes a reintroduced GOARCH simulator check a
      # failing diff instead of a device-only crash discovered after release.
      - name: generated shaders select the Apple target
        run: |
          go generate ./engine/shader/compiled
          if [ -n "$(git status --porcelain engine/shader/compiled)" ]; then
            echo "the committed shader bindings are not target-aware:"
            git --no-pager diff --stat engine/shader/compiled
            exit 1
          fi

      # Everything above compiles one operating system for one architecture.
      # A target that is offered and never built is found broken by whoever
      # builds it next, and that person is cutting a release or has already
      # downloaded one.
      #
      # Windows is what this runner can add with nothing installed. That
      # backend reaches the window, the input and the GPU through the
      # operating system's own calls rather than through a C library, so no
      # file in the build has a compiler to look for and both architectures
      # come out of the toolchain that is already here. The desktop and phone
      # platforms left out each want a toolchain on this machine first --
      # Linux on ARM a cross-compiler and the same development packages built
      # for ARM, macOS and iOS their platform SDK, Android its native
      # development kit -- and a runner that installs those to produce a
      # binary nothing here can start costs more than it catches.
      #
      # What it does not prove is that any of this runs. The window is opened
      # by a call this never makes, on a device it never creates, with shaders
      # it never hands to a driver. A binary that links says the code is valid
      # for the platform and says nothing at all about what happens when
      # somebody opens it.
      - name: Windows still compiles
        env:
          # On, because that is how a platform that draws to a window is
          # built. Nothing under Windows reaches C today, so nothing goes
          # looking for a compiler; the day something does, this stops instead
          # of quietly compiling a different program from the one that ships.
          CGO_ENABLED: "1"
        run: |
          for target in windows/amd64 windows/arm64; do
            echo "building for $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      # Cross-compilation does not touch the X11 and Wayland event loops. Open
      # the catalogue on a real X server, require its window to appear, and
      # leave it alive long enough to cross the first GPU frames.
      - name: the Linux window opens and stays alive
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a bash .github/scripts/linux-runtime.sh

      # The pictures, which are the only gate that says the controls draw.
      # Everything else here passes on a screen that renders nothing: a build
      # does not run the shaper, and a layout test reads dimensions without
      # reaching a rasteriser.
      #
      # It needs a drawing surface, and a runner has no GPU -- Mesa's software
      # renderer is what answers, which is why the packages above include it.
      # Where there is nothing at all to draw on the test says so and skips,
      # because a gate that fails for the machine rather than the change is a
      # gate people learn to ignore.
      - name: the screens look like they did
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a go test -count=1 -run TestScreensLookLikeTheyDid -v ./frame/

      # What the comparison drew, when it did not match. Without this the only
      # evidence is a pixel count, and a pixel count cannot tell an edge that
      # softened from a control that moved.
      - name: the pictures that did not match
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pictures
          path: frame/testdata/*.failed.png
          if-no-files-found: ignore

      # The publishing half is a module of its own, so ./... in the root does
      # not reach it. Its tests are the ones that compare the two halves of the
      # content negotiation, which is the pair that fails silently when it
      # drifts.
      - name: vet and test the publishing module
        run: |
          go -C module vet ./...
          go -C module test -race ./...

      # The palette is generated from the stylesheet, and the generated file is
      # committed: go get has no build step, so what is in the repository is
      # what every project reads. A hand edit compiles, looks right, and is
      # undone by the next regeneration.
      #
      # Scoped to the package rather than run over the tree: the engine carries
      # generate directives of its own, pointing at a shader compiler that was
      # not part of the closure copied here. The compiled shaders are in the
      # tree, so there is nothing for it to produce -- and `go generate ./...`
      # in the root fails on the missing command rather than on anything about
      # the palette.
      - name: the palette is the one the stylesheet declares
        run: |
          go generate ./theme/...
          if [ -n "$(git status --porcelain theme)" ]; then
            echo "the committed palette does not match the stylesheet:"
            git --no-pager diff --stat theme
            exit 1
          fi

      # Zero Node, in a repository that draws its own pixels and has no reason
      # to acquire one.
      - name: no Node
        run: |
          found=$(find . -name package.json -o -name node_modules -o -name 'vite.config.*' | grep -v '^./.git' || true)
          if [ -n "$found" ]; then
            echo "Node entered the tree:"
            echo "$found"
            exit 1
          fi

      # Required by the documentation standard: a known vulnerability blocks the
      # merge rather than showing up in a report nobody reads.
      #
      # The engine is source here, so its vulnerabilities are this repository's
      # to answer for. That is the cost of the fork, and it is the point of
      # running this on the whole tree rather than on the packages we wrote.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          (cd module && govulncheck ./...)

  windows-runtime:
    name: Windows x64 runtime
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: D3D11 hardware fallback and WARP render pixels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = & go test -count=1 -run '^(TestHeadless|TestWARPHeadless)$' -v ./engine/gpu/headless 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:RUNNER_TEMP\headless.log"
          if ($exitCode -ne 0) {
            throw "The D3D11 headless rendering test failed."
          }
          if (($output -join "`n") -match '--- SKIP: Test(Headless|WARPHeadless)') {
            throw "The D3D11 rendering test skipped; this is not runtime evidence."
          }

      - name: Catalogue opens a responsive WARP window
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:RUNNER_TEMP\ayra-catalogue.exe"
          $stdout = "$env:RUNNER_TEMP\catalogue.stdout.log"
          $stderr = "$env:RUNNER_TEMP\catalogue.stderr.log"

          # noopengl makes this proof fail if WARP device + swap-chain creation
          # fails; no EGL fallback can turn a D3D11 failure green.
          & go -C catalogue build -trimpath '-tags=ayra_d3d11_warp noopengl' '-ldflags=-H=windowsgui' -o $exe .
          if ($LASTEXITCODE -ne 0) {
            throw "The Windows catalogue build failed."
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          namespace RuntimeProof {
              public static class Native {
                  [StructLayout(LayoutKind.Sequential)]
                  public struct RECT {
                      public int Left;
                      public int Top;
                      public int Right;
                      public int Bottom;
                  }

                  [DllImport("user32.dll", SetLastError = true)]
                  [return: MarshalAs(UnmanagedType.Bool)]
                  public static extern bool GetClientRect(
                      IntPtr window,
                      out RECT rectangle
                  );
              }
          }
          '@

          $process = Start-Process `
            -FilePath $exe `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(45)
            $window = [IntPtr]::Zero
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) {
                $details = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
                throw "The catalogue exited with code $($process.ExitCode).`n$details"
              }
              if (
                $process.MainWindowHandle -ne [IntPtr]::Zero -and
                $process.MainWindowTitle -eq "Controls"
              ) {
                $window = $process.MainWindowHandle
                break
              }
            }

            if ($window -eq [IntPtr]::Zero) {
              throw "No visible Controls window appeared within 45 seconds."
            }

            $client = [RuntimeProof.Native+RECT]::new()
            if (-not [RuntimeProof.Native]::GetClientRect($window, [ref] $client)) {
              throw "GetClientRect failed."
            }
            $width = $client.Right - $client.Left
            $height = $client.Bottom - $client.Top
            if ($width -lt 640 -or $height -lt 480) {
              throw "Unexpected client area: ${width}x${height}."
            }

            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) {
              throw "The catalogue exited after opening its window."
            }
            if (-not $process.Responding) {
              throw "The Controls window stopped responding."
            }
            Write-Host "Controls window stayed responsive at ${width}x${height}."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              [void] $process.WaitForExit(5000)
            }
          }

      - name: Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayra-windows-runtime
          path: |
            ${{ runner.temp }}/headless.log
            ${{ runner.temp }}/catalogue.stdout.log
            ${{ runner.temp }}/catalogue.stderr.log
          if-no-files-found: ignore
