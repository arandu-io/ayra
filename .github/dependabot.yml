# Two ecosystems, because those are the two this project has: the Go module
# graph and the actions the workflows pin. There is no npm entry here and there
# will not be one -- nothing in any of these repositories installs Node.
#
# Two gomod entries, because a gomod entry watches exactly one directory and
# this repository is two modules. The root is the library and carries the
# vendored engine's eight dependencies, which is the graph that most needs
# watching: a flaw inherited from upstream arrives here as ours to fix. The
# module directory is the half a project installs, and it requires the framework
# and nothing else.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/module"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
